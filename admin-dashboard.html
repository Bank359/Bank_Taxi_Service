<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Bank Taxi Service</title>
    <!-- Google Fonts - Sarabun -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0b3c5d;
            --secondary: #328cc1;
            --accent: #38bdf8;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            padding: 30px 20px;
            color: var(--text-main);
        }

        .admin-wrapper {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header Bar */
        .admin-header {
            background: linear-gradient(135deg, #0b3c5d, #142834);
            color: #ffffff;
            padding: 20px 30px;
            border-radius: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 25px rgba(11, 60, 93, 0.15);
            margin-bottom: 30px;
        }

        .admin-header h1 {
            margin: 0;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logout-btn {
            background: #e11d48;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.95rem;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logout-btn:hover {
            background: #be123c;
            transform: translateY(-2px);
        }

        /* Stats Cards (แผงสรุปภาพรวม) */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 35px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.04);
            border: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .stat-icon {
            width: 60px;
            height: 60px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
        }

        .stat-icon.blue { background: rgba(50, 140, 193, 0.1); color: var(--secondary); }
        .stat-icon.yellow { background: rgba(245, 158, 11, 0.1); color: #f59e0b; }
        .stat-icon.green { background: rgba(16, 185, 129, 0.1); color: #10b981; }

        .stat-info h3 {
            margin: 0 0 5px 0;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .stat-info p {
            margin: 0;
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--primary);
        }

        /* Main Content Card */
        .content-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
        }

        .content-card h2 {
            margin-top: 0;
            margin-bottom: 20px;
            color: var(--primary);
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Table Design */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.95rem;
        }

        th {
            background: #f8fafc;
            color: var(--primary);
            padding: 14px 16px;
            font-weight: 700;
            border-bottom: 2px solid #e2e8f0;
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid #e2e8f0;
            color: #334155;
            vertical-align: middle;
        }

        tr:hover td {
            background-color: #f8fafc;
        }

        /* Status Badges */
        .badge {
            padding: 6px 12px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .badge.pending { background: #fef3c7; color: #d97706; }
        .badge.confirmed { background: #d1fae5; color: #059669; }
        .badge.cancelled { background: #fee2e2; color: #dc2626; }

        /* Action Buttons */
        .action-btns {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-action {
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: 0.2s;
        }

        .btn-slip { background: #e0f2fe; color: #0284c7; }
        .btn-slip:hover { background: #bae6fd; }

        .btn-line { background: #dcfce7; color: #16a34a; }
        .btn-line:hover { background: #bbf7d0; }

        .btn-delete { background: #fee2e2; color: #dc2626; }
        .btn-delete:hover { background: #fecaca; }

        /* Status Select Dropdown */
        .status-select {
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            font-family: 'Sarabun', sans-serif;
            font-size: 0.85rem;
            cursor: pointer;
        }

        /* Modal สำหรับดูสลิป */
        #slipModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: #ffffff;
            padding: 25px;
            border-radius: 20px;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            position: relative;
        }

        .modal-content img {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            margin-top: 15px;
        }

        .close-modal {
            position: absolute;
            top: 15px; right: 20px;
            font-size: 1.5rem;
            cursor: pointer;
            color: #64748b;
        }

        @media (max-width: 768px) {
            .admin-header { flex-direction: column; gap: 15px; text-align: center; }
            body { padding: 15px 10px; }
        }
    </style>
</head>
<body>

    <div class="admin-wrapper">
        
        <!-- Header -->
        <div class="admin-header">
            <h1><i class="fa-solid fa-gauge-high"></i> แผงควบคุมแอดมิน (Admin Dashboard)</h1>
            <button class="logout-btn" onclick="logoutAdmin()"><i class="fa-solid fa-right-from-bracket"></i> ออกจากระบบ</button>
        </div>

        <!-- Overview Stats (แผงสรุปภาพรวม) -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon blue"><i class="fa-solid fa-calendar-check"></i></div>
                <div class="stat-info">
                    <h3>ยอดจองทั้งหมด</h3>
                    <p id="total-bookings">0</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon yellow"><i class="fa-solid fa-clock-rotate-left"></i></div>
                <div class="stat-info">
                    <h3>รอดำเนินการ (รอตรวจสลิป)</h3>
                    <p id="pending-bookings">0</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon green"><i class="fa-solid fa-wallet"></i></div>
                <div class="stat-info">
                    <h3>รายได้มัดจำรวม (100.-)</h3>
                    <p id="total-deposit">0 บาท</p>
                </div>
            </div>
        </div>

        <!-- Booking Table (ตารางรายการจอง) -->
        <div class="content-card">
            <h2><i class="fa-solid fa-list-check"></i> รายการจองของลูกค้าล่าสุด</h2>
            
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>วันที่/เวลา</th>
                            <th>ชื่อลูกค้า & เบอร์โทร</th>
                            <th>เส้นทาง & รุ่นรถ</th>
                            <th>ราคารวม</th>
                            <th>สถานะการจอง</th>
                            <th>หลักฐานสลิป</th>
                            <th>จัดการข้อมูล</th>
                        </tr>
                    </thead>
                    <tbody id="booking-table-body">
                        <!-- ข้อมูลจะถูกดึงมาแสดงตรงนี้ด้วย JavaScript -->
                    </tbody>
                </table>
            </div>
            
            <div id="empty-state" style="text-align: center; padding: 40px; color: var(--text-muted); display: none;">
                <i class="fa-solid fa-folder-open" style="font-size: 3rem; margin-bottom: 10px; color: #cbd5e1;"></i>
                <p>ยังไม่มีรายการจองในระบบ</p>
            </div>
        </div>

    </div>

    <!-- Modal สำหรับแสดงรูปสลิป -->
    <div id="slipModal" onclick="closeSlipModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="close-modal" onclick="closeSlipModal()">&times;</span>
            <h3 style="margin-top:0; color:var(--primary);">หลักฐานการโอนเงิน (สลิปมัดจำ)</h3>
            <img id="modalSlipImg" src="" alt="Slip Image">
        </div>
    </div>

    <!-- Script สำหรับจัดการระบบแอดมิน -->
    <script>
        // โหลดข้อมูลจำลองหรือข้อมูลจริงจาก localStorage ที่ลูกค้าจองเข้ามา
        let bookings = JSON.parse(localStorage.getItem('bankTaxiBookings')) || [
            // ข้อมูลตัวอย่างเริ่มต้น (สามารถลบออกได้)
            {
                id: 1,
                date: "2026-06-06 14:30",
                name: "คุณสมชาย ใจดี",
                phone: "0948798228",
                lineid: "@somchai",
                email: "somchai@example.com",
                car: "Toyota Camry",
                route: "สุวรรณภูมิ - พัทยา",
                price: "1,000 บาท",
                status: "pending", // pending, confirmed, cancelled
                slipImg: "https://images.unsplash.com/photo-1554224155-8d04cb21cd6c?auto=format&fit=crop&w=400&q=80"
            }
        ];

        function renderDashboard() {
            const tbody = document.getElementById('booking-table-body');
            const emptyState = document.getElementById('empty-state');
            tbody.innerHTML = '';

            if (bookings.length === 0) {
                emptyState.style.display = 'block';
                document.getElementById('total-bookings').textContent = '0';
                document.getElementById('pending-bookings').textContent = '0';
                document.getElementById('total-deposit').textContent = '0 บาท';
                return;
            }

            emptyState.style.display = 'none';

            let pendingCount = 0;
            let totalDeposit = bookings.length * 100; // สมมติมัดจำเคสละ 100 บาท

            bookings.forEach((b, index) => {
                if (b.status === 'pending') pendingCount++;

                let badgeClass = 'pending';
                let badgeText = 'รอดำเนินการ';
                if (b.status === 'confirmed') { badgeClass = 'confirmed'; badgeText = 'ยืนยันแล้ว'; }
                if (b.status === 'cancelled') { badgeClass = 'cancelled'; badgeText = 'ยกเลิก'; }

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><small style="color:var(--text-muted);">${b.date}</small></td>
                    <td>
                        <strong>${b.name}</strong><br>
                        <span style="font-size:0.85rem; color:var(--text-muted);">${b.phone}</span><br>
                        <a href="https://line.me/ti/p/~${b.lineid}" target="_blank" class="btn-action btn-line" style="margin-top:4px;"><i class="fa-brands fa-line"></i> ${b.lineid}</a>
                    </td>
                    <td>
                        <strong>${b.car}</strong><br>
                        <span style="font-size:0.85rem; color:var(--secondary);">${b.route}</span>
                    </td>
                    <td><strong>${b.price}</strong></td>
                    <td>
                        <select class="status-select" onchange="updateStatus(${index}, this.value)">
                            <option value="pending" ${b.status === 'pending' ? 'selected' : ''}>🟡 รอดำเนินการ</option>
                            <option value="confirmed" ${b.status === 'confirmed' ? 'selected' : ''}>🟢 ยืนยันการจอง</option>
                            <option value="cancelled" ${b.status === 'cancelled' ? 'selected' : ''}>🔴 ยกเลิก</option>
                        </select>
                    </td>
                    <td>
                        <button class="btn-action btn-slip" onclick="openSlipModal('${b.slipImg || 'https://images.unsplash.com/photo-1554224155-8d04cb21cd6c?auto=format&fit=crop&w=400&q=80'}')">
                            <i class="fa-solid fa-receipt"></i> ดูสลิป
                        </button>
                    </td>
                    <td>
                        <button class="btn-action btn-delete" onclick="deleteBooking(${index})">
                            <i class="fa-solid fa-trash"></i> ลบ
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            // อัปเดตตัวเลขสถิติภาพรวม
            document.getElementById('total-bookings').textContent = bookings.length;
            document.getElementById('pending-bookings').textContent = pendingCount;
            document.getElementById('total-deposit').textContent = totalDeposit.toLocaleString() + ' บาท';
        }

        // ฟังก์ชันเปลี่ยนสถานะ
        function updateStatus(index, newStatus) {
            bookings[index].status = newStatus;
            localStorage.setItem('bankTaxiBookings', JSON.stringify(bookings));
            renderDashboard();
        }

        // ฟังก์ชันลบข้อมูลการจอง
        function deleteBooking(index) {
            if (confirm('คุณต้องการลบรายการจองนี้ออกจากระบบใช่หรือไม่?')) {
                bookings.splice(index, 1);
                localStorage.setItem('bankTaxiBookings', JSON.stringify(bookings));
                renderDashboard();
            }
        }

        // ฟังก์ชันเปิด/ปิด Modal ดูสลิป
        function openSlipModal(imgSrc) {
            document.getElementById('modalSlipImg').src = imgSrc;
            document.getElementById('slipModal').style.display = 'flex';
        }

        function closeSlipModal() {
            document.getElementById('slipModal').style.display = 'none';
        }

        // ฟังก์ชันออกจากระบบ
        function logoutAdmin() {
            window.location.href = "index.html";
        }

        // โหลดข้อมูลเมื่อเปิดหน้าแอดมิน
        window.addEventListener('DOMContentLoaded', () => {
            renderDashboard();
        });
    </script>
    <!-- เรียกใช้งาน Firebase SDK ผ่าน CDN -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // 1. นำ config ของคุณมาใส่ตรงนี้ (ชุดเดียวกับหน้าจอง)
  const firebaseConfig = {
    apiKey: "AIzaSyASv5AeTc3XJjILvvU9ca7sE27901Zt9aU",
    authDomain: "bank-taxi-service.firebaseapp.com",
    projectId: "bank-taxi-service",
    storageBucket: "bank-taxi-service.appspot.com",
    messagingSenderId: "12836327344",
    appId: "1:12836327344:web:ab2255c4ca38beda763435",
    measurementId: "G-N2LDVWQ57M"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // 2. ฟังก์ชันดึงข้อมูลการจองทั้งหมดจาก Firestore มาแสดงในตารางแอดมิน
  async function loadAdminBookings() {
      const tbody = document.getElementById('booking-table-body');
      const emptyState = document.getElementById('empty-state');
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:20px;">กำลังโหลดข้อมูลจาก Cloud...</td></tr>';

      try {
          const querySnapshot = await getDocs(collection(db, "bookings"));
          tbody.innerHTML = '';

          if (querySnapshot.empty) {
              emptyState.style.display = 'block';
              document.getElementById('total-bookings').textContent = '0';
              document.getElementById('pending-bookings').textContent = '0';
              document.getElementById('total-deposit').textContent = '0 บาท';
              return;
          }

          emptyState.style.display = 'none';
          let totalCount = 0;
          let pendingCount = 0;

          querySnapshot.forEach((documentSnapshot) => {
              totalCount++;
              const b = documentSnapshot.data();
              const docId = documentSnapshot.id; // ไอดีเอกสารใน Firebase

              if (b.status === 'pending') pendingCount++;

              let badgeClass = 'pending';
              let badgeText = 'รอดำเนินการ';
              if (b.status === 'confirmed') { badgeClass = 'confirmed'; badgeText = 'ยืนยันแล้ว'; }
              if (b.status === 'cancelled') { badgeClass = 'cancelled'; badgeText = 'ยกเลิก'; }

              const tr = document.createElement('tr');
              tr.innerHTML = `
                  <td><small style="color:var(--text-muted);">${b.date || '-'}</small></td>
                  <td>
                      <strong>${b.name}</strong><br>
                      <span style="font-size:0.85rem; color:var(--text-muted);">${b.phone}</span><br>
                      <a href="https://line.me/ti/p/~${b.lineid}" target="_blank" class="btn-action btn-line" style="margin-top:4px;"><i class="fa-brands fa-line"></i> ${b.lineid}</a>
                  </td>
                  <td>
                      <strong>${b.car}</strong><br>
                      <span style="font-size:0.85rem; color:var(--secondary);">${b.route}</span>
                  </td>
                  <td><strong>${b.price}</strong></td>
                  <td>
                      <select class="status-select" onchange="updateCloudStatus('${docId}', this.value)">
                          <option value="pending" ${b.status === 'pending' ? 'selected' : ''}>🟡 รอดำเนินการ</option>
                          <option value="confirmed" ${b.status === 'confirmed' ? 'selected' : ''}>🟢 ยืนยันการจอง</option>
                          <option value="cancelled" ${b.status === 'cancelled' ? 'selected' : ''}>🔴 ยกเลิก</option>
                      </select>
                  </td>
                 <td>
    <button class="btn-action btn-slip" onclick="openSlipModal('${b.slipBase64 || b.slipUrl || ''}')">
        <i class="fa-solid fa-receipt"></i> ดูสลิป
    </button>
</td>
                  <td>
                      <button class="btn-action btn-delete" onclick="deleteCloudBooking('${docId}')">
                          <i class="fa-solid fa-trash"></i> ลบ
                      </button>
                  </td>
              `;
              tbody.appendChild(tr);
          });

          // อัปเดตตัวเลขสถิติ
          document.getElementById('total-bookings').textContent = totalCount;
          document.getElementById('pending-bookings').textContent = pendingCount;
          document.getElementById('total-deposit').textContent = (totalCount * 100).toLocaleString() + ' บาท';

      } catch (e) {
          console.error("Error loading bookings: ", e);
          tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:red; padding:20px;">เกิดข้อผิดพลาดในการโหลดข้อมูล</td></tr>';
      }
  }

  // 3. ฟังก์ชันอัปเดตสถานะบน Cloud
 window.updateCloudStatus = async function(docId, newStatus) {
    try {
        const docRef = doc(db, "bookings", docId);
        
        // 1. อัปเดตสถานะลง Firestore ก่อน
        await updateDoc(docRef, { status: newStatus });

        // 2. ถ้าแอดมินเปลี่ยนสถานะเป็น "ยืนยันการจอง" (confirmed) ให้ส่งเมลหาลูกค้าอัตโนมัติ
        if (newStatus === 'confirmed') {
            // ดึงข้อมูลเอกสารนั้นมาเพื่อเอาชื่อและอีเมลของลูกค้า
            // (หรือถ้าในฟังก์ชันมีข้อมูลลูกค้ารวมอยู่แล้ว สามารถดึงมาใช้ได้เลย)
            
            const templateParams = {
                to_name: "คุณลูกค้า", // หรือดึงชื่อจริงจากข้อมูลในตาราง
                to_email: "อีเมลลูกค้า", // ดึงอีเมลจริงจากข้อมูลในตาราง
                phone: "-",
                car_type: "-",
                route: "-",
                price: "-",
                booking_id: docId
            };

            await emailjs.send('service_bwg87un', 'YOUR_TEMPLATE_ID', templateParams);
            console.log('Confirmation email sent to customer successfully!');
        }

        alert('อัปเดตสถานะและส่งอีเมลยืนยันสำเร็จ!');
    } catch (e) {
        console.error("Error updating status: ", e);
        alert('ไม่สามารถอัปเดตสถานะได้');
    }
};

  // 4. ฟังก์ชันลบข้อมูลบน Cloud
  window.deleteCloudBooking = async function(docId) {
      if (confirm('คุณต้องการลบรายการจองนี้ออกจากระบบ Cloud ใช่หรือไม่?')) {
          try {
              await deleteDoc(doc(db, "bookings", docId));
              alert('ลบข้อมูลสำเร็จ!');
              loadAdminBookings(); // Reload ตารางใหม่
          } catch (e) {
              console.error("Error deleting document: ", e);
              alert('ไม่สามารถลบข้อมูลได้');
          }
      }
  };

  // เรียกใช้งานเมื่อเปิดหน้าแอดมิน
  window.addEventListener('DOMContentLoaded', () => {
      loadAdminBookings();
  });
</script>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
       (function(){
          emailjs.init("TLr-PYAljdYhpJqk9"); // Public Key ของคุณ
       })();
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyASv5AeTc3XJjILvvU9ca7sE27901Zt9aU",
            authDomain: "bank-taxi-service.firebaseapp.com",
            projectId: "bank-taxi-service",
            storageBucket: "bank-taxi-service.appspot.com",
            messagingSenderId: "12836327344",
            appId: "1:12836327344:web:ab2255c4ca38beda763435",
            measurementId: "G-N2LDVWQ57M"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 1. ฟังก์ชันดึงข้อมูลการจองทั้งหมดจาก Firestore มาแสดงในตารางแอดมิน
        async function loadAdminBookings() {
            const tbody = document.getElementById('booking-table-body');
            const emptyState = document.getElementById('empty-state');
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:20px;">กำลังโหลดข้อมูลจาก Cloud...</td></tr>';

            try {
                const querySnapshot = await getDocs(collection(db, "bookings"));
                tbody.innerHTML = '';

                if (querySnapshot.empty) {
                    emptyState.style.display = 'block';
                    document.getElementById('total-bookings').textContent = '0';
                    document.getElementById('pending-bookings').textContent = '0';
                    document.getElementById('total-deposit').textContent = '0 บาท';
                    return;
                }

                emptyState.style.display = 'none';
                let totalCount = 0;
                let pendingCount = 0;

                querySnapshot.forEach((documentSnapshot) => {
                    totalCount++;
                    const b = documentSnapshot.data();
                    const docId = documentSnapshot.id;

                    if (b.status === 'pending') pendingCount++;

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><small style="color:var(--text-muted);">${b.date || '-'}</small></td>
                        <td>
                            <strong>${b.name}</strong><br>
                            <span style="font-size:0.85rem; color:var(--text-muted);">${b.phone}</span><br>
                            <a href="https://line.me/ti/p/~${b.lineid}" target="_blank" class="btn-action btn-line" style="margin-top:4px;"><i class="fa-brands fa-line"></i> ${b.lineid}</a>
                        </td>
                        <td>
                            <strong>${b.carType || b.car}</strong><br>
                            <span style="font-size:0.85rem; color:var(--secondary);">${b.route}</span>
                        </td>
                        <td><strong>${typeof b.price === 'number' ? b.price.toLocaleString() + ' THB' : b.price}</strong></td>
                        <td>
                            <select class="status-select" onchange="updateCloudStatus('${docId}', this.value)">
                                <option value="pending" ${b.status === 'pending' ? 'selected' : ''}>🟡 รอดำเนินการ</option>
                                <option value="confirmed" ${b.status === 'confirmed' ? 'selected' : ''}>🟢 ยืนยันการจอง</option>
                                <option value="cancelled" ${b.status === 'cancelled' ? 'selected' : ''}>🔴 ยกเลิก</option>
                            </select>
                        </td>
                        <td>
                            <button class="btn-action btn-slip" onclick="openSlipModal('${b.slipBase64 || b.slipUrl || ''}')">
                                <i class="fa-solid fa-receipt"></i> ดูสลิป
                            </button>
                        </td>
                        <td>
                            <button class="btn-action btn-delete" onclick="deleteCloudBooking('${docId}')">
                                <i class="fa-solid fa-trash"></i> ลบ
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });

                document.getElementById('total-bookings').textContent = totalCount;
                document.getElementById('pending-bookings').textContent = pendingCount;
                document.getElementById('total-deposit').textContent = (totalCount * 100).toLocaleString() + ' บาท';

            } catch (e) {
                console.error("Error loading bookings: ", e);
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:red; padding:20px;">เกิดข้อผิดพลาดในการโหลดข้อมูล</td></tr>';
            }
        }

        // 2. ฟังก์ชันอัปเดตสถานะบน Cloud และส่งอีเมลอัตโนมัติเมื่อเลือก "confirmed"
        window.updateCloudStatus = async function(docId, newStatus) {
            try {
                const docRef = doc(db, "bookings", docId);
                
                // อัปเดตสถานะลง Firestore ก่อน
                await updateDoc(docRef, { status: newStatus });

                // ถ้าแอดมินเปลี่ยนสถานะเป็น "ยืนยันการจอง" (confirmed) ให้ดึงข้อมูลมาส่งเมล
                if (newStatus === 'confirmed') {
                    const docSnap = await getDoc(docRef);
                    if (docSnap.exists()) {
                        const data = docSnap.data();

                        const templateParams = {
                            to_name: data.name,
                            to_email: data.email,
                            phone: data.phone,
                            car_type: data.carType || data.car,
                            route: data.route,
                            price: typeof data.price === 'number' ? data.price.toLocaleString() + " THB" : data.price,
                            booking_id: docId
                        };

                        // ส่งอีเมลผ่าน EmailJS ด้วย Template ID ที่ถูกต้อง
                        await emailjs.send('service_bwg87un', 'template_cd0p4xa', templateParams);
                        console.log('Confirmation email sent successfully!');
                    }
                }

                alert('อัปเดตสถานะและส่งอีเมลยืนยันสำเร็จ!');
            } catch (e) {
                console.error("Error updating status or sending email: ", e);
                alert('อัปเดตสถานะสำเร็จ แต่เกิดข้อผิดพลาดในการส่งอีเมล');
            }
        };

        // 3. ฟังก์ชันลบข้อมูลบน Cloud
        window.deleteCloudBooking = async function(docId) {
            if (confirm('คุณต้องการลบรายการจองนี้ออกจากระบบ Cloud ใช่หรือไม่?')) {
                try {
                    await deleteDoc(doc(db, "bookings", docId));
                    alert('ลบข้อมูลสำเร็จ!');
                    loadAdminBookings();
                } catch (e) {
                    console.error("Error deleting document: ", e);
                    alert('ไม่สามารถลบข้อมูลได้');
                }
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            loadAdminBookings();
        });
    </script>
    <script src="mobile-switcher.js"></script>
</body>

</html>
